### Preprocessing

Object-centered coordinate system

* Flownet2.0: Optical flow of that region

Video: think of it as stacked images (volumetric)

### How to decompose the object?

Combine apearance and flow!

<img width="35%" src="figures/cropped.png">
--
<small>
\\[
\phi(x,y,t)= \begin{bmatrix}\alpha (x,y,t)^T \\\\ (L,a,b)^T \\\\ \beta (\hat{F}_x, \hat{F}_y)^T\end{bmatrix}, \text{dimensionality } 8 \times 1
\\] 
</small>

* Our goal: Represent certain parts in that subvolume.
    * Therefore need a way to set the **scale**

---

### Scale selection in Gaussian scale space

$$\mathscr{L}(\cdot;\sigma{^2}, \tau{^2}) =  g(\cdot; \sigma{^2}, \tau{^2}) * f(\cdot)$$

`\(\sigma\)` ... spatial scale

`\(\tau\)` ... temporal scale

### Technical Considerations

#### Dense Method
* Uses masks in every frame
* **Fails** if a single mask extraction fails

--

#### Sparse Method
* Use masks every 15 frames and track the object
* Only different Pre-processing


<center><img width="30%" src="figures/pipeline_sparse.png">

### Evaluation

#### DAVIS Dataset
* 50 videos, average duration ~70 frames
* Ground truth segmentation masks
* Classes which Mask R-CNN can recognize
    * Humans, Animals, Cars, Bikes, etc.

#### Metrics
* Segmentation Accuracy (3D) "How much do we get right?"
* Under-segmentation Error (3D) "How much do we get wrong?"

---

### Evaluation

#### Quantiative Results
* Able to evaluate 47/50 videos with **sparse**, and 39/50 with **dense** method.
--

* Segmentation performance average with automatic scale selection
    * Little differece beween **sparse** and **dense** method
    * Lower Accuracy than Mask R-CNN 
    * Lower Under-segmentation Error than Mask R-CNN

### Conclusion

#### Representation of salient objects
* Decomposition into meaningful parts
* Variable (per object) scale - with proposed automatic scale selection
* Shown viability to use sparse masks (anchors) to provide focus on objects

#### Different frames of reference
* Object-centered: Emphasizes relative motion between object parts
* Viewer-centered: Dynamics of a scene and possibly trajectories

#### Novel representation that might be useful for other applications
