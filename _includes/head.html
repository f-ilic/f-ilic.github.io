<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Inline script to apply the theme immediately before rendering -->
  <script>
    (function () {
      const scheme = localStorage.getItem('color-scheme') || 'auto';
      
      let style = document.createElement('style');
      document.head.appendChild(style);

      // Apply light or dark mode via inline CSS early before the page renders
      if (scheme === 'dark') {
        style.innerHTML = 'html { background-color: black; color: white; }';
        document.documentElement.classList.add('dark-mode');
      } else if (scheme === 'light') {
        style.innerHTML = 'html { background-color: white; color: black; }';
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>

  <!-- Link to external CSS file for full styling -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
</head>
