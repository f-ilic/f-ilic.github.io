<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">

  {%- if page.url == "/" -%}
    {%- assign page_title = site.title -%}
  {%- else -%}
    {%- assign page_title = page.title | replace: "<br>", " " | strip_html | append: " | " | append: site.title -%}
  {%- endif %}
  <title>{{ page_title | escape }}</title>

  <link rel="icon" href="{{ "/favicon.svg" | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">

  <!-- Apply the saved colour scheme before the first paint, so there is no flash of the wrong theme.
       Kept in sync with the Light/System/Dark toggle in modetoggle.html. -->
  <script>
    (function () {
      var scheme = null;
      try { scheme = localStorage.getItem('color-scheme'); } catch (e) {}
      if (scheme === 'light' || scheme === 'dark') {
        document.documentElement.style.colorScheme = scheme;
      }
    })();
  </script>

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
</head>
