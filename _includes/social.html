{%- if site.email -%}<a title="Email" href="mailto:{{ site.email }}"><img class="svg-social-icon" src="{{"/assets/social-icons/email.svg" | | relative_url}}" /></a>{%- endif -%}
{%- if site.github_username -%}<a title="Github" href="https://github.com/{{ site.github_username| cgi_escape | escape }}"><img class="svg-social-icon" src="{{"/assets/social-icons/github.svg" | | relative_url}}" /></a>{%- endif -%}
{%- if site.linkedin_username -%}<a title="LinkedIn" href="https://www.linkedin.com/in/{{ site.linkedin_username| cgi_escape | escape }}"><img class="svg-social-icon" src="{{"/assets/social-icons/linkedin.svg" | | relative_url}}" /></a>{%- endif -%}
{%- if site.medium_username -%}<a title="LinkedIn" href="https://www.linkedin.com/in/{{ site.linkedin_username| cgi_escape | escape }}"><img class="svg-social-icon" src="{{"/assets/social-icons/medium.svg" | | relative_url}}" /></a>{%- endif -%}
{%- if site.scholar_username -%}<a title="Google Scholar" href="https://scholar.google.com/citations?user={{site.scholar_username | cgi_escape | escape }}"><img class="svg-social-icon" src="{{"/assets/social-icons/google_scholar.svg" | | relative_url}}" /></a>{%- endif -%}
{%- if site.rsa_key -%}<a title="sha256sum of rsa key: b63aba5728e9d4ea0582bb92b080f42bf5425af94a57a1e3b979d5ea443b966f" href="../assets/id_rsa.txt"><img class="svg-social-icon" src="{{"/assets/social-icons/lock.svg" | | relative_url}}" /></a>{%- endif -%}
