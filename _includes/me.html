<div class="site-header container">
  <a class="avatar-link" href="{{ "/" | relative_url }}" title="Homepage">
    <img class="avatar" src="{{ "/assets/facepic_rect.jpg" | relative_url }}" alt="Homepage" width="96" height="96">
  </a>
  <div class="identity">
    {%- if page.url == "/" %}
    <h1 class="site-name">Filip Ilic</h1>
    {%- else %}
    <p class="site-name"><a href="{{ "/" | relative_url }}">Filip Ilic</a></p>
    {%- endif %}
    <p class="site-tagline">
      Computer Vision & Machine Learning Engineer at Snap
      <img class="snap-logo" src="{{ "/assets/snap.svg" | relative_url }}" alt="" width="18" height="18">
    </p>
    {%- include social.html -%}
  </div>
  <div class="header-tools">
    {%- include modetoggle.html -%}
  </div>
</div>
