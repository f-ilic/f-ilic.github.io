<!-- Light / System / Dark colour scheme toggle. The checked radio drives `color-scheme` via CSS (:has),
     the script below remembers the choice and applies it inline on <html> (see head.html). -->
<fieldset class="toggle-group" id="colorScheme">
    <legend data-sr>Colour scheme</legend>
    <label>
        <input type="radio" name="color-scheme" value="light" id="color-scheme-light" data-sr>{% include icons/theme-lightmode.html %}
        <span class="theme-text">Light</span>
    </label>
    <label>
        <input type="radio" name="color-scheme" value="light dark" id="default-scheme" data-sr checked>{% include icons/theme-default.html %}
        <span class="theme-text">System</span>
    </label>
    <label>
        <input type="radio" name="color-scheme" value="dark" id="color-scheme-dark" data-sr>{% include icons/theme-darkmode.html %}
        <span class="theme-text">Dark</span>
    </label>
</fieldset>
<script>
    (function () {
        var group = document.getElementById('colorScheme');
        var radios = Array.prototype.slice.call(group.querySelectorAll('input[name="color-scheme"]'));

        // 'light' and 'dark' force a scheme; anything else ('light dark') follows the system setting.
        function applyColorScheme(scheme) {
            document.documentElement.style.colorScheme = (scheme === 'light' || scheme === 'dark') ? scheme : '';
        }

        var saved = null;
        try { saved = localStorage.getItem('color-scheme'); } catch (e) {}
        radios.forEach(function (radio) {
            if (radio.value === saved) radio.checked = true;
        });
        applyColorScheme(saved);

        group.addEventListener('change', function (event) {
            try { localStorage.setItem('color-scheme', event.target.value); } catch (e) {}
            applyColorScheme(event.target.value);
        });
    })();
</script>
