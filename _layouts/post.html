---
layout: default
---

<br>
<div class="item-wrapper">
    <table role="presentation">
        <tr>
            <td width="100%" style="padding: 0px">
                <div class="paper-info">
                    <div class="paper-head">
                        <h1>{{page.title}}</h1>
                        <hr>
                        <span class="paper-authors">{{page.subheading}}</span>
                        <span class="paper-published">{{page.published}}</span>
                    </div>
                </div>
                <div class="paper-links">
                    {% if page.code != nil %}
                    <a href="{% include url.html url=page.code %}">{% include icons/code.html %}Code</a>
                    {% endif %}
                    {% if page.paper != nil %}
                    <a href="{% include url.html url=page.paper %}">{% include icons/bookmark.html %}Paper</a>
                    {% endif %}
                </div>
            </td>
        </tr>
    </table>
    {{content}}
</div>
<a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
