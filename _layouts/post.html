---
layout: default
---

<br>
<div class="item-wrapper">
    <table>
        <tr>
            <td width="100%" style="padding: 0px">
                <div class="paper-info">
                    <div class="paper-head">
                        <!-- <span class="paper-title">{{page.title}}</span> -->
                        <h1>{{page.title}}</h1>
                        <hr>
                        <span class="paper-authors">{{page.subheading}}</span>
                        <span class="paper-published">{{page.published}}</span>
                    </div>
                </div>
                <div class="paper-links">
                    {% if page.code != nil %}
                    <a href="{{ page.code }}"><img class='icon-size code-icon'>Code</a>
                    {% endif %}
                    {% if page.paper != nil %}
                    <a href="{{ page.paper }}"><img class='icon-size info-icon'>Paper</a>
                    {% endif %}
                </div>
            </td>
        </tr>
    </table>
    {{content}}
</div>
<a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
