---
layout: default
---
<div class="item-wrapper">
      <div class="item">
            <div class="upper-row">
                <div class="time tiny">{{page.date | date: "%b %Y"}}</div>
                <div class="post-list-title">{{page.title}}</div>
            </div>
            <div class="subheading">
                {{page.subheading}}
            <div class="venue"><b>{{page.venue}}</b></div>
                <hr style="margin-bottom: 20px;">
            </div>
            {{content}}
          </div>
      </div>
<a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
<a href='/'>Back to homepage</a>
