---
layout: default
---



  <div class="item-wrapper">

      <div class="item">
              <div class="upper-row">
                  <div class="time tiny">{{page.date | date_to_string}}</div>
                  <h1>{{page.title}}</h1>
              </div>
              <div class="company tiny">
                  {{page.subheading}}
              </div>
              <div class="muted-gray">
                {{content}}
              </div>
          </div>
      </div>
<a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
